<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Entrenador">
<meta name="application-name" content="Entrenador">
<meta name="theme-color" content="#EEF0EC" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#10151D" media="(prefers-color-scheme: dark)">
<title>Entrenador</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-512.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF0EC; --surface:#FFFFFF; --surface-2:#F6F7F4; --ink:#1C2430; --muted:#6A7380; --line:#D9DDD5;
  --primary:#2E4A8C; --primary-soft:#DFE5F2; --on-primary:#FFFFFF; --accent:#C2333D; --accent-soft:#F6DEDF;
  --ok:#2F7A55; --ok-soft:#DCEFE4; --warn:#9A6400; --warn-soft:#F6EBD3;
  --font:"Barlow", -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --display:"Barlow Condensed", "Arial Narrow", -apple-system, "Segoe UI", Roboto, sans-serif;
  --tabbar:64px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#10151D; --surface:#18202B; --surface-2:#1F2835; --ink:#E7EAEE; --muted:#97A0AD; --line:#2A3442;
    --primary:#8AA4E6; --primary-soft:#24314A; --on-primary:#0E1420; --accent:#E25A63; --accent-soft:#3A2227;
    --ok:#5FBF8D; --ok-soft:#1D3328; --warn:#E3B05A; --warn-soft:#3A2F1A; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#10151D; --surface:#18202B; --surface-2:#1F2835; --ink:#E7EAEE; --muted:#97A0AD; --line:#2A3442;
  --primary:#8AA4E6; --primary-soft:#24314A; --on-primary:#0E1420; --accent:#E25A63; --accent-soft:#3A2227;
  --ok:#5FBF8D; --ok-soft:#1D3328; --warn:#E3B05A; --warn-soft:#3A2F1A; color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--primary)}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
.app{max-width:640px;margin:0 auto;padding:8px 16px calc(var(--tabbar) + 32px + env(safe-area-inset-bottom,0px))}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:12px 2px 6px}
h1{font-family:var(--display);font-weight:700;font-size:40px;line-height:1;letter-spacing:.2px;margin:0}
.sub{color:var(--muted);font-size:15px;margin:4px 2px 14px}
h2{font-family:var(--display);font-weight:600;font-size:22px;margin:26px 2px 8px;line-height:1.1}
h3{font-size:16px;font-weight:600;margin:0}
p{margin:0 0 8px}
.small{font-size:14px;color:var(--muted)}
.iconbtn{background:var(--surface);border:1px solid var(--line);border-radius:999px;width:40px;height:40px;display:grid;place-items:center;flex:none}
.iconbtn svg{width:20px;height:20px;stroke:var(--ink)}
.group{background:var(--surface);border-radius:16px;overflow:hidden;border:1px solid var(--line)}
.row{padding:13px 14px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row.flex{display:flex;align-items:center;gap:12px}
.grow{flex:1;min-width:0}
.cycle{display:flex;gap:4px;margin:2px 0 4px}
.cycle span{flex:1;height:8px;border-radius:4px;background:var(--line)}
.cycle span.done{background:var(--primary-soft)}
.cycle span.now{background:var(--primary)}
.cycle span.deload.now{background:var(--warn)}
.pill{display:inline-block;font-size:13px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--primary-soft);color:var(--primary)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.accent{background:var(--accent-soft);color:var(--accent)}
.seg{display:flex;gap:6px;overflow-x:auto;padding:2px 0 4px;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-weight:500;font-size:15px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;padding:12px 16px;font-weight:600;background:var(--primary);color:var(--on-primary);min-height:46px}
.btn.secondary{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn.block{width:100%}
.btn.danger{background:var(--accent);color:#fff}
.note{border-radius:14px;padding:12px 14px;background:var(--surface-2);border:1px solid var(--line);font-size:15px}
.note.warn{background:var(--warn-soft);border-color:transparent}
.note.alert{background:var(--accent-soft);border-color:transparent}
.note.ok{background:var(--ok-soft);border-color:transparent}
.note b{font-weight:600}
.stack>*+*{margin-top:10px}
/* exercise */
.ex{background:var(--surface);border:1px solid var(--line);border-radius:16px;margin-top:12px;overflow:hidden}
.ex-h{padding:14px 14px 10px}
.ex-name{font-weight:600;font-size:17px;line-height:1.25}
.ex-meta{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:6px;font-size:14px;color:var(--muted)}
.ex-meta b{color:var(--ink);font-weight:600}
.coach{margin:8px 14px 0;padding:9px 12px;border-radius:10px;background:var(--primary-soft);color:var(--ink);font-size:14px}
.coach.up{background:var(--ok-soft)}
.sets{padding:6px 8px 12px}
.set{display:grid;grid-template-columns:30px 1fr 1fr 64px 46px;gap:6px;align-items:center;padding:4px 6px;border-radius:12px}
.set.done{background:var(--ok-soft)}
.set .n{font-family:var(--display);font-weight:600;font-size:20px;color:var(--muted);text-align:center}
.set label{display:block}
.set input,.set select{width:100%;font-family:var(--display);font-weight:600;font-size:24px;text-align:center;border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:6px 4px;min-height:46px;-webkit-appearance:none;appearance:none}
.set select{font-size:18px;font-family:var(--font);font-weight:500}
.set input::placeholder{color:var(--muted);opacity:.6;font-weight:500}
.set .chk{width:46px;height:46px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);display:grid;place-items:center}
.set.done .chk{background:var(--ok);border-color:var(--ok)}
.set .chk svg{width:22px;height:22px;stroke:var(--muted)}
.set.done .chk svg{stroke:#fff}
.set-head{display:grid;grid-template-columns:30px 1fr 1fr 64px 46px;gap:6px;padding:0 6px 2px;font-size:12px;color:var(--muted);text-align:center}
.unit{font-size:12px;color:var(--muted)}
details{border-top:1px solid var(--line)}
details:first-child{border-top:0}
summary{list-style:none;padding:14px;font-weight:600;display:flex;justify-content:space-between;align-items:center;cursor:pointer}
summary::-webkit-details-marker{display:none}
summary::after{content:"";width:9px;height:9px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);margin-right:4px;transition:transform .15s}
details[open] summary::after{transform:rotate(-135deg)}
.dbody{padding:0 14px 14px}
.tbl{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:500;font-size:13px}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
/* meals */
.meal{display:flex;gap:12px;align-items:flex-start}
.tick{flex:none;width:28px;height:28px;border-radius:8px;border:1.5px solid var(--line);background:var(--surface);display:grid;place-items:center;margin-top:2px}
.tick svg{width:18px;height:18px;stroke:transparent}
.tick[aria-pressed="true"]{background:var(--primary);border-color:var(--primary)}
.tick[aria-pressed="true"] svg{stroke:var(--on-primary)}
.meal .time{font-family:var(--display);font-weight:600;color:var(--muted);font-size:16px}
.macros{display:flex;gap:10px;font-size:13px;color:var(--muted);margin-top:4px;flex-wrap:wrap}
.bars{display:grid;gap:10px}
.bar .lbl{display:flex;justify-content:space-between;font-size:14px}
.bar .lbl b{font-family:var(--display);font-size:18px;font-weight:600}
.bar .track{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin-top:4px}
.bar .fill{height:100%;background:var(--primary);border-radius:4px}
.water{display:flex;align-items:center;gap:12px}
.big{font-family:var(--display);font-weight:700;font-size:44px;line-height:1}
.big small{font-size:18px;font-weight:600;color:var(--muted)}
.stepper{display:flex;gap:8px}
.stepper button{width:46px;height:46px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);font-size:22px;font-weight:600}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px}
.switch{flex:none;width:52px;height:32px;border-radius:16px;background:var(--line);border:0;position:relative;transition:background .15s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .15s}
.switch[aria-checked="true"]{background:var(--ok)}
.switch[aria-checked="true"]::after{transform:translateX(20px)}
.field{display:flex;align-items:center;gap:8px}
.field input{width:100%;font-size:17px;border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:10px 12px;min-height:46px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px}
.stat .v{font-family:var(--display);font-weight:700;font-size:30px;line-height:1.05}
.stat .k{font-size:13px;color:var(--muted)}
.chart{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 10px 6px}
.chart svg{width:100%;height:auto;display:block}
.empty{color:var(--muted);font-size:15px;padding:18px 14px;text-align:center}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.week div{padding:8px 0;border-radius:10px;background:var(--surface);border:1px solid var(--line);font-size:12px;color:var(--muted)}
.week div b{display:block;font-family:var(--display);font-size:17px;color:var(--ink);font-weight:600}
.week div.today{border-color:var(--primary);box-shadow:inset 0 0 0 1px var(--primary)}
.week div.trained{background:var(--ok-soft)}
/* tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;background:var(--surface);background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:20}
.tabbar nav{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);height:var(--tabbar)}
.tabbar button{background:none;border:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:500;color:var(--muted)}
.tabbar svg{width:24px;height:24px;stroke:currentColor}
.tabbar button[aria-current="page"]{color:var(--primary)}
/* sheets */
.scrim{position:fixed;inset:0;background:rgba(10,14,20,.45);z-index:40;display:none}
.scrim.show{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--bg);border-radius:20px 20px 0 0;max-height:88vh;overflow:auto;padding:10px 16px calc(20px + env(safe-area-inset-bottom,0px));transform:translateY(105%);transition:transform .22s ease}
.sheet.show{transform:none}
.sheet .grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 10px}
.sheet-in{max-width:640px;margin:0 auto}
.timer{position:fixed;left:12px;right:12px;bottom:calc(var(--tabbar) + 10px + env(safe-area-inset-bottom,0px));z-index:30;max-width:616px;margin:0 auto;background:var(--ink);color:var(--bg);border-radius:18px;padding:10px 12px;display:none;align-items:center;gap:12px}
.timer.show{display:flex}
.timer .ring{width:56px;height:56px;flex:none}
.timer .t{font-family:var(--display);font-weight:700;font-size:34px;line-height:1}
.timer .lbl{font-size:13px;opacity:.75}
.timer button{background:rgba(255,255,255,.14);color:inherit;border:0;border-radius:10px;padding:9px 11px;font-weight:600}
:root[data-theme="dark"] .timer button{background:rgba(0,0,0,.12)}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 10px);transform:translate(-50%,-200%);visibility:hidden;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;font-weight:500;z-index:60;transition:transform .2s;max-width:90vw;text-align:center}
.toast.show{transform:translate(-50%,0);visibility:visible}
.checklist label{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-top:1px solid var(--line)}
.checklist label:first-child{border-top:0}
.checklist input{width:22px;height:22px;margin:1px 0 0;accent-color:var(--primary);flex:none}
.links a{display:block;padding:13px 14px;border-top:1px solid var(--line);text-decoration:none;font-weight:500}
.links a:first-child{border-top:0}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<main class="app" id="app" aria-live="polite"></main>

<div class="timer" id="timer" role="timer" aria-live="off">
  <svg class="ring" viewBox="0 0 56 56" aria-hidden="true"><circle cx="28" cy="28" r="24" fill="none" stroke="currentColor" stroke-opacity=".2" stroke-width="5"/><circle id="ringFg" cx="28" cy="28" r="24" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" transform="rotate(-90 28 28)" stroke-dasharray="150.8" stroke-dashoffset="0"/></svg>
  <div class="grow"><div class="t" id="timerT">0:00</div><div class="lbl" id="timerL">Descanso</div></div>
  <button type="button" data-action="timer-add">+15 s</button>
  <button type="button" data-action="timer-stop">Saltar</button>
</div>

<div class="scrim" id="scrim" data-action="close-sheet"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Panel"><div class="grab"></div><div class="sheet-in" id="sheetIn"></div></div>

<div class="tabbar"><nav aria-label="Secciones">
  <button type="button" data-tab="hoy"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 6.5v11M17.5 6.5v11M3.5 9v6M20.5 9v6M6.5 12h11"/></svg>Hoy</button>
  <button type="button" data-tab="comida"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11h16a8 8 0 0 1-16 0zM8 7c0-1.5 1-2 1-3.5M12 7c0-1.5 1-2 1-3.5M16 7c0-1.5 1-2 1-3.5"/></svg>Comida</button>
  <button type="button" data-tab="progreso"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 20h18M5 16l4.5-5 3.5 3 6-7"/><path d="M15 7h4v4"/></svg>Progreso</button>
  <button type="button" data-tab="rutina"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>Semana</button>
  <button type="button" data-tab="guia"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4.5h10.5a3 3 0 0 1 3 3V20H8a3 3 0 0 1-3-3z"/><path d="M5 17a3 3 0 0 1 3-3h10.5"/></svg>Guía</button>
</nav></div>

<script>
"use strict";
/* ============ PROGRAMA ============ */
const DAYS = {
  A:{name:"Torso A", wd:1, ex:[
    {id:"press-pecho-maq",n:"Press de pecho en máquina, sentado",note:"Torso vertical; agarre a la altura del pecho",s:[3,3],r:[8,10],rir:[1,2],rest:180,inc:2.5},
    {id:"remo-pecho",n:"Remo con apoyo en pecho",note:"T-bar o máquina",s:[3,3],r:[8,12],rir:[1,2],rest:150,inc:2.5},
    {id:"press-incl-manc",n:"Press inclinado con mancuernas (30°)",s:[2,3],r:[8,12],rir:[1,2],rest:150,inc:1,dbell:true},
    {id:"jalon-prono",n:"Jalón al pecho, agarre prono",s:[2,3],r:[10,12],rir:[1,1],rest:120,inc:2.5},
    {id:"lat-polea",n:"Elevaciones laterales en polea",s:[3,4],r:[12,20],rir:[0,1],rest:90,inc:1},
    {id:"curl-incl",n:"Curl inclinado con mancuernas",s:[2,2],r:[10,15],rir:[0,1],rest:90,inc:1,dbell:true},
    {id:"ext-tri-cabeza",n:"Extensión de tríceps sobre la cabeza",note:"En polea",s:[2,2],r:[10,15],rir:[0,1],rest:90,inc:2.5}
  ]},
  PA:{name:"Pierna A", wd:2, ex:[
    {id:"prensa",n:"Prensa de piernas",note:"Pelvis siempre pegada al respaldo",s:[3,3],r:[10,15],rir:[1,2],rest:150,inc:5},
    {id:"curl-fem",n:"Curl femoral sentado",s:[3,3],r:[10,15],rir:[0,1],rest:90,inc:2.5},
    {id:"hiperext",n:"Hiperextensión a 45°",note:"Enfoque glúteo e isquios",s:[2,3],r:[12,15],rir:[1,2],rest:120,inc:2.5},
    {id:"ext-cuad",n:"Extensión de cuádriceps",s:[2,2],r:[12,15],rir:[0,1],rest:90,inc:2.5},
    {id:"abduccion",n:"Abducción de cadera en máquina",s:[2,3],r:[15,20],rir:[0,1],rest:90,inc:2.5},
    {id:"talones-pie",n:"Elevación de talones de pie",note:"Pausa 1–2 s abajo",s:[3,4],r:[10,15],rir:[0,1],rest:90,inc:2.5},
    {id:"rodillas-paralelas",n:"Elevaciones de rodillas en paralelas",note:"Exhala al subir. Carga: 0 si es sin peso",s:[3,3],r:[10,15],rir:[1,1],rest:90,inc:0}
  ]},
  B:{name:"Torso B", wd:4, ex:[
    {id:"press-incl-barra",n:"Press inclinado con barra o en máquina",s:[3,3],r:[8,10],rir:[1,2],rest:180,inc:2.5},
    {id:"dominadas",n:"Dominadas o jalón, agarre neutro",note:"En dominadas registra el lastre (0 = peso corporal)",s:[3,3],r:[8,12],rir:[1,2],rest:150,inc:2.5},
    {id:"remo-polea",n:"Remo en polea sentado",s:[2,3],r:[10,12],rir:[1,1],rest:120,inc:2.5},
    {id:"aperturas",n:"Aperturas en polea o pec deck",s:[2,2],r:[12,15],rir:[0,1],rest:90,inc:2.5},
    {id:"lat-manc",n:"Elevaciones laterales con mancuernas",s:[3,4],r:[12,20],rir:[0,1],rest:90,inc:1,dbell:true},
    {id:"pajaros",n:"Pájaros en máquina",note:"Reverse pec deck",s:[2,3],r:[15,20],rir:[0,1],rest:90,inc:2.5},
    {id:"curl-martillo",n:"Curl martillo",note:"Superserie: pasa directo al pushdown",s:[2,2],r:[10,15],rir:[0,1],rest:0,inc:1,dbell:true},
    {id:"pushdown",n:"Pushdown de tríceps en polea",note:"Descansa al terminar la superserie",s:[2,2],r:[10,15],rir:[0,1],rest:90,inc:2.5}
  ]},
  PB:{name:"Pierna B", wd:5, ex:[
    {id:"bulgara",n:"Sentadilla búlgara con mancuernas",note:"Torso ligeramente inclinado",s:[3,3],r:[10,12],repLabel:"10–12 por pierna",rir:[1,2],rest:120,inc:1,dbell:true},
    {id:"hip-thrust",n:"Hip thrust",note:"Máquina o barra",s:[3,3],r:[10,15],rir:[1,2],rest:120,inc:5},

const LS_P="entrenador.profile.v1", LS_W="entrenador.workouts.v1";
function mergeProfile(r,l){
  const newer=(l.updated||0)>(r.updated||0)?l:r, older=newer===l?r:l;
  const out=Object.assign(defaultProfile(),JSON.parse(JSON.stringify(newer)));
  ["body","food","health"].forEach(k=>{out[k]=Object.assign({},older[k]||{},newer[k]||{});});
  out.photos=[...new Set([...(r.photos||[]),...(l.photos||[])])].sort();
  out.settings=Object.assign(defaultProfile().settings,older.settings||{},newer.settings||{});
  out.updated=Math.max(r.updated||0,l.updated||0);
  return out;
}
function defaultProfile(){return {settings:{start:mondayOf(today()),fullCycle2:true},body:{},food:{},health:{},photos:[],updated:0};}
const Store = {
  profile: defaultProfile(), workouts:{}, mode:"local", pRef:null, wCol:null, chains:{}, timers:{},
  loadLocal(){
    try{const p=localStorage.getItem(LS_P);if(p)this.profile=Object.assign(defaultProfile(),JSON.parse(p));}catch(e){}
    try{const w=localStorage.getItem(LS_W);if(w)this.workouts=JSON.parse(w)||{};}catch(e){}
  },
  saveLocal(){
    try{localStorage.setItem(LS_P,JSON.stringify(this.profile));}catch(e){}
    try{localStorage.setItem(LS_W,JSON.stringify(this.workouts));}catch(e){}
  },
  async initCloud(){
    if(!window.claude||typeof window.claude.use!=="function")return;
    let db=null,user=null;
    try{[db,user]=await Promise.all([window.claude.use("db"),window.claude.use("user")]);}catch(e){return;}
    if(!db||!user)return;
    let uid=null;try{uid=await user.id();}catch(e){}
    if(!uid)return;
    try{
      this.pRef=db.doc("data/users/"+uid+"/profile");
      this.wCol=this.pRef.collection("workouts");
      const snap=await this.pRef.get();
      const remote=snap.exists?snap.data():null;
      const remoteJSON=remote?JSON.stringify(remote):null;
      if(remote)this.profile=mergeProfile(JSON.parse(remoteJSON),this.profile);
      const ws=await this.wCol.limit(1000).get();
      const remoteIds=new Set();
      ws.docs.forEach(d=>{remoteIds.add(d.id);const r=d.data();const l=this.workouts[d.id];
        if(!l||(r.updated||0)>=(l.updated||0))this.workouts[d.id]=JSON.parse(JSON.stringify(r));});
      this.mode="cloud";
      if(!remote||JSON.stringify(this.profile)!==remoteJSON)this.pushProfile(true);
      Object.keys(this.workouts).forEach(id=>{if(!remoteIds.has(id))this.pushWorkout(id,true);});
      this.saveLocal();
      render();
    }catch(e){this.mode="local";this.pRef=null;this.wCol=null;}
  },
  write(key,ref,dataFn){
    this.chains[key]=(this.chains[key]||Promise.resolve()).then(()=>ref.set(dataFn())).catch(e=>{
      if(e&&e.code==="unavailable"){return new Promise(r=>setTimeout(r,800+Math.random()*800)).then(()=>ref.set(dataFn())).catch(()=>{});}
      if(e&&(e.code==="invalid_argument"||e.code==="revoked"||e.code==="not_granted")){this.mode="local";toast("Sin conexión a la nube: se guarda en este dispositivo");}
      if(e&&e.code==="quota_exceeded"){toast("Espacio de guardado lleno: exporta y borra datos antiguos");}
    });
  },
  pushProfile(now){
    if(this.mode!=="cloud"||!this.pRef)return;
    clearTimeout(this.timers.p);
    const go=()=>this.write("p",this.pRef,()=>JSON.parse(JSON.stringify(this.profile)));
    if(now)go();else this.timers.p=setTimeout(go,900);
  },
  pushWorkout(id,now){
    if(this.mode!=="cloud"||!this.wCol)return;
    clearTimeout(this.timers[id]);
    const go=()=>{const w=this.workouts[id];if(w)this.write("w:"+id,this.wCol.doc(id),()=>JSON.parse(JSON.stringify(w)));};
    if(now)go();else this.timers[id]=setTimeout(go,900);
  },
  touchProfile(){this.profile.updated=Date.now();this.saveLocal();this.pushProfile();},
  touchWorkout(id){this.workouts[id].updated=Date.now();this.saveLocal();this.pushWorkout(id);}
};

/* ============ LÓGICA DEL ENTRENADOR ============ */
function weekInfo(dateS){
  const start=Store.profile.settings.start||mondayOf(today());
  const diff=daysBetween(start,dateS);
  if(diff<0)return {cycle:1,week:1,phase:"inicial",before:true};
  const cycle=Math.floor(diff/42)+1, week=Math.floor((diff%42)/7)+1;
  let phase=week===6?"descarga":(week>=4?"completo":"inicial");
  if(phase==="inicial"&&cycle>=2&&Store.profile.settings.fullCycle2)phase="completo";
  return {cycle,week,phase};
}
const PHASE_TXT={inicial:"Volumen inicial",completo:"Volumen completo",descarga:"Semana de descarga"};
function isComp(ex){return ex.rir[0]>=1&&ex.rir[1]===2;}
function setsFor(ex,wi){
  if(wi.phase==="descarga")return Math.max(1,Math.round(ex.s[1]/2));
  return wi.phase==="inicial"?ex.s[0]:ex.s[1];
}
function rirFor(ex,wi){
  let [lo,hi]=ex.rir;
  if(wi.week===1){lo+=1;hi+=1;}
  else if(wi.week===5&&!isComp(ex)){hi=lo;}
  else if(wi.week===6){lo+=2;hi+=2;}
  return [lo,hi];
}
function sessionsFor(exId,beforeDate,skipDeload){
  return Object.values(Store.workouts)
    .filter(w=>w.sets&&w.sets[exId]&&w.sets[exId].some(s=>s.done)&&(!beforeDate||w.date<beforeDate)&&!(skipDeload&&w.week===6))
    .sort((a,b)=>a.date<b.date?-1:1);
}
function e1rm(kg,reps){return kg*(1+reps/30);}
function bestOf(w,exId){
  let best=null;(w.sets[exId]||[]).forEach(s=>{if(!s.done)return;const kg=+s.kg||0,r=+s.reps||0;if(!r)return;const v=kg>0?e1rm(kg,r):r;if(best==null||v>best)best=v;});return best;
}
function roundInc(v,inc){if(!inc)return v;return Math.round(v/inc)*inc;}
function coachFor(ex,dateS,wi){
  const hist=sessionsFor(ex.id,dateS,true);
  if(!hist.length)return {kg:null,text:"Primera vez: elige una carga con la que termines cada serie dentro de "+(ex.repLabel||range(ex.r))+" repeticiones al RIR indicado.",up:false};
  const last=hist[hist.length-1];
  const done=last.sets[ex.id].filter(s=>s.done&&+s.reps>0);
  if(!done.length)return {kg:null,text:"Sin datos completos de la sesión anterior.",up:false};
  const kg=Math.max(...done.map(s=>+s.kg||0));
  const topSets=done.filter(s=>(+s.kg||0)===kg);
  const allTop=topSets.length>=Math.min(done.length,setsFor(ex,wi))&&topSets.every(s=>+s.reps>=ex.r[1]);
  const per=ex.dbell?" por mancuerna":"";
  const failComp=isComp(ex)&&done.some(s=>String(s.rir)==="0");
  const failTxt=failComp?" La vez pasada llegaste al fallo en este compuesto: quédate a 1–2 repeticiones de él.":"";
  const lastTxt=fmtNum(kg)+" kg × "+topSets.map(s=>s.reps).join(", ")+" reps, el "+fmtDateShort(last.date);
  if(wi.phase==="descarga")return {kg,text:"Descarga: usa la misma carga ("+fmtNum(kg)+" kg), la mitad de series y deja 3–4 repeticiones en reserva.",up:false};
  if(allTop&&ex.inc>0){
    const nk=ex.dbell?kg+ex.inc:roundInc(kg*1.025,ex.inc)>kg?roundInc(kg*1.025,ex.inc):kg+ex.inc;
    return {kg:nk,text:"Llegaste al tope del rango la vez pasada ("+lastTxt+"). Sube a "+fmtNum(nk)+" kg"+per+" y vuelve a "+ex.r[0]+" repeticiones."+failTxt,up:true};
  }
  if(allTop&&ex.inc===0)return {kg,text:"Tope del rango alcanzado ("+lastTxt+"). Añade un poco de lastre o haz la bajada más lenta (3 s).",up:true};
  return {kg,text:"Mantén "+fmtNum(kg)+" kg"+per+" y suma al menos 1 repetición en alguna serie. Última vez: "+lastTxt+"."+failTxt,up:false};
}
function stalledExercises(){
  const out=[];
  Object.keys(ALL_EX).forEach(id=>{
    const h=sessionsFor(id,null,true).slice(-3);if(h.length<3)return;
    const b=h.map(w=>bestOf(w,id));
    if(b[2]!=null&&b[0]!=null&&b[2]<=b[0]&&b[1]<=b[0])out.push(id);
  });
  return out;
}

function getWorkout(dateS,day,wi,create){
  const id=workoutId(dateS,day);
  if(!Store.workouts[id]&&create){
    const sets={};
    DAYS[day].ex.forEach(ex=>{const c=coachFor(ex,dateS,wi);sets[ex.id]=Array.from({length:setsFor(ex,wi)},()=>({kg:c.kg!=null?c.kg:"",reps:"",rir:"",done:false}));});
    Store.workouts[id]={date:dateS,day,cycle:wi.cycle,week:wi.week,sets,finished:false,updated:Date.now()};
  }
  return Store.workouts[id];
}

function avgSleep(endS){const v=[];for(let i=0;i<7;i++){const b=Store.profile.body[addDays(endS,-i)];if(b&&b.sleep!=null&&b.sleep!=="")v.push(+b.sleep);}return v.length>=3?v.reduce((a,b)=>a+b,0)/v.length:null;}

function extendWeek(){const st=Store.profile.settings,wi=weekInfo(today());st.ext=st.ext&&st.ext.cycle===wi.cycle?st.ext:{cycle:wi.cycle,count:0};st.ext.count++;st.start=addDays(st.start,7);Store.touchProfile();}
function canExtend(wi){const e=Store.profile.settings.ext;return !(e&&e.cycle===wi.cycle&&e.count>=2);}
function deloadBtn(){const wi=weekInfo(today());return (!wi.before&&wi.week>=2&&wi.week<=5)?' <button type="button" class="btn secondary" style="margin-top:8px;min-height:38px;padding:8px 12px" data-action="deload-now">Adelantar la descarga a esta semana</button>':"";}

function refluxInsight(){
  const days=Object.entries(Store.profile.food);
  const items=[["cacao","cacao"],["citricos","cítricos"],["granada","granada"]];
  const lines=[];
  items.forEach(([k,lab])=>{const w=days.filter(([,f])=>f[k]);if(w.length>=2){const s=w.filter(([,f])=>f.reflujo).length;const base=days.filter(([,f])=>!f[k]&&!f.cacao&&!f.citricos&&!f.granada);const bs=base.filter(([,f])=>f.reflujo).length;const pct=Math.round(s/w.length*100), bp=base.length?Math.round(bs/base.length*100):null;lines.push("Con "+lab+": síntomas en "+s+" de "+w.length+" días ("+pct+" %)"+(bp!=null?"; sin opcionales: "+bp+" %":"")+".");}});
  if(!lines.length)return "";

function avgWindow(entries,endS,days){const start=addDays(endS,-(days-1));const v=entries.filter(e=>e.d>=start&&e.d<=endS).map(e=>e.v);return v.length?{avg:v.reduce((a,b)=>a+b,0)/v.length,n:v.length}:null;}
function renderProgreso(){
  const t=today();
  const W=Object.entries(Store.profile.body).filter(([,b])=>b.w!=null&&b.w!=="").map(([d,b])=>({d,v:+b.w})).sort((a,b)=>a.d<b.d?-1:1);
  const C=Object.entries(Store.profile.body).filter(([,b])=>b.waist!=null&&b.waist!=="").map(([d,b])=>({d,v:+b.waist})).sort((a,b)=>a.d<b.d?-1:1);
  const a1=avgWindow(W,t,7), a0=avgWindow(W,addDays(t,-7),7);

  const m=mondayOf(t);let sessW=0;for(let i=0;i<7;i++){const d=addDays(m,i);if(ORDER.some(k=>{const w=Store.workouts[workoutId(d,k)];return w&&Object.values(w.sets).some(a=>a.some(s=>s.done));}))sessW++;}

    stat(a1?fmtNum(a1.avg,1)+" kg":"—","Peso, promedio 7 días")+

    stat(lastC?fmtNum(lastC.v,1)+" cm":"—","Cintura"+(dC!=null?" ("+(dC>0?"+":"")+fmtNum(dC,1)+" cm en 2 sem)":""))+
    stat(sessW+" de 5","Sesiones esta semana")+

  h+='<h2>Peso corporal</h2>';
  if(W.length>=2){
    const avgPts=W.map(e=>{const a=avgWindow(W,e.d,7);return {x:parseD(e.d).getTime(),y:a.avg};});
    h+='<div class="chart">'+lineChart([{pts:W.map(e=>({x:parseD(e.d).getTime(),y:e.v})),color:"var(--muted)",dots:true,w:0},{pts:avgPts,color:"var(--primary)",w:2.5}],{unit:"kg"})+'<p class="small" style="margin:4px 6px 4px">Puntos: pesajes diarios. Línea: promedio de 7 días, que es el dato que importa.</p></div>';
  }else h+='<div class="group"><div class="empty">Registra tu peso en ayunas 3–4 mañanas por semana desde la pestaña Hoy. Con dos registros aparece la gráfica.</div></div>';

function coachInsights(rate,dC,W,C){
  const out=[];
  if(rate==null)out.push({cls:"",html:"<b>Aún faltan datos de peso.</b> Con 3 o más pesajes en cada una de las últimas 2 semanas calculo tu tendencia."});
  else if(rate>0.35)out.push({cls:"warn",html:"<b>Estás subiendo de peso más rápido de lo previsto</b> ("+fmtNum(rate,2)+" % por semana). En recomposición buscamos entre 0 y +0,25 % semanal. "+(dC!=null&&dC>=0.5?"Tu cintura también sube: reduce ≈ 100 kcal (por ejemplo, 25 g menos de arroz).":"Vigila la cintura esta semana antes de ajustar.")});
  else if(rate<-0.25)out.push({cls:"warn",html:"<b>Estás bajando de peso</b> ("+fmtNum(rate,2)+" % por semana). Para recomposición conviene no perder: añade ≈ 100–150 kcal (por ejemplo, 1 rebanada de pan o 1 plátano)."});
  else out.push({cls:"ok",html:"<b>Tu peso va según el plan</b> ("+(rate>0?"+":"")+fmtNum(rate,2)+" % por semana). Sigue igual."});
  if(dC!=null&&dC>=1)out.push({cls:"warn",html:"<b>Tu cintura subió "+fmtNum(dC,1)+" cm en 2 semanas.</b> Si no es por hinchazón puntual, reduce ≈ 100 kcal."});
  const stalled=stalledExercises();
  if(stalled.length>=3)out.push({cls:"warn",html:"<b>"+stalled.length+" ejercicios no progresan en sus últimas 3 sesiones</b> ("+stalled.slice(0,4).map(id=>esc(ALL_EX[id])).join(", ")+"). Señal de fatiga acumulada: considera adelantar la semana de descarga y revisa sueño y comida."});
  if(stalled.length>=3)out[out.length-1].html+=deloadBtn();
  else if(stalled.length)out.push({cls:"",html:"<b>Estancado:</b> "+stalled.map(id=>esc(ALL_EX[id])).join(", ")+". Revisa técnica y descanso; si sigue así 2 sesiones más, cambia por una variante del mismo músculo."});
  const sl=avgSleep(today());
  if(sl!=null&&sl<7)out.push({cls:"warn",html:"<b>Duermes en promedio "+fmtNum(sl,1)+" h.</b> Por debajo de 7 h se resiente la recuperación y la testosterona. Es el ajuste con más impacto que puedes hacer fuera del gimnasio."});
  const pa=proteinAvg(today());
  if(pa!=null&&pa<120)out.push({cls:"warn",html:"<b>Tu proteína promedio es "+fmtNum(pa,0)+" g al día</b> (objetivo ≈ 140 g). Marca las comidas que haces en la pestaña Comida; si te falta alguna, el yogur griego o 2 huevos extra cubren la diferencia."});
  const first=W.length?W[0].d:null;
  if(first&&daysBetween(first,today())>=56&&rate!=null&&Math.abs(rate)<0.1&&stalled.length>=2)out.push({cls:"",html:"<b>Revisión de 8 semanas:</b> peso estable y fuerza estancada. Según el plan, toca pasar a un superávit del 5 % (≈ +125 kcal)."});
  return out;
}
function lineChart(series,opt){
  const W=340,H=170,L=38,R=10,T=10,B=24;
  const all=series.flatMap(s=>s.pts);
  if(!all.length)return "";
  let x0=Math.min(...all.map(p=>p.x)),x1=Math.max(...all.map(p=>p.x));if(x0===x1){x0-=86400000;x1+=86400000;}
  let y0=Math.min(...all.map(p=>p.y)),y1=Math.max(...all.map(p=>p.y));const padY=(y1-y0)*0.15||1;y0-=padY;y1+=padY;
  const X=x=>L+(x-x0)/(x1-x0)*(W-L-R), Y=y=>T+(1-(y-y0)/(y1-y0))*(H-T-B);
  let g='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Gráfica">';
  [y0+padY,(y0+y1)/2,y1-padY].forEach(v=>{g+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+Y(v).toFixed(1)+'" y2="'+Y(v).toFixed(1)+'" stroke="var(--line)" stroke-width="1"/><text x="'+(L-6)+'" y="'+(Y(v)+4).toFixed(1)+'" font-size="11" text-anchor="end" fill="var(--muted)" font-family="Barlow, sans-serif">'+fmtNum(v,1)+'</text>';});
  const fd=x=>{const d=new Date(x);return d.getDate()+"/"+(d.getMonth()+1);};
  g+='<text x="'+L+'" y="'+(H-6)+'" font-size="11" fill="var(--muted)" font-family="Barlow, sans-serif">'+fd(x0)+'</text><text x="'+(W-R)+'" y="'+(H-6)+'" font-size="11" text-anchor="end" fill="var(--muted)" font-family="Barlow, sans-serif">'+fd(x1)+'</text>';
  series.forEach(s=>{
    const pts=s.pts.slice().sort((a,b)=>a.x-b.x);
    if(s.w)g+='<polyline fill="none" stroke="'+s.color+'" stroke-width="'+s.w+'" stroke-linejoin="round" stroke-linecap="round" points="'+pts.map(p=>X(p.x).toFixed(1)+","+Y(p.y).toFixed(1)).join(" ")+'"/>';
    if(s.dots)pts.forEach(p=>{g+='<circle cx="'+X(p.x).toFixed(1)+'" cy="'+Y(p.y).toFixed(1)+'" r="3" fill="'+s.color+'"/>';});
  });
  return g+"</svg>";
}

/* ============ TEMPORIZADOR ============ */
const Timer={end:0,total:0,iv:null,ctx:null,
  start(sec,label){if(!sec)return;this.total=sec*1000;this.end=Date.now()+this.total;$("#timerL").textContent=label||"Descanso";$("#timer").classList.add("show");this.ensureAudio();clearInterval(this.iv);this.iv=setInterval(()=>this.tick(),250);this.tick();},
  add(s){this.end+=s*1000;this.total+=s*1000;this.tick();},
  stop(){clearInterval(this.iv);$("#timer").classList.remove("show");},
  tick(){const left=Math.max(0,this.end-Date.now());const s=Math.ceil(left/1000);$("#timerT").textContent=Math.floor(s/60)+":"+pad(s%60);$("#ringFg").setAttribute("stroke-dashoffset",(150.8*(1-left/this.total)).toFixed(1));if(left<=0){this.beep();this.stop();toast("Descanso terminado: siguiente serie");}},
  ensureAudio(){try{if(!this.ctx){const C=window.AudioContext||window.webkitAudioContext;if(C)this.ctx=new C();}if(this.ctx&&this.ctx.state==="suspended")this.ctx.resume();}catch(e){}},
  beep(){try{if(!this.ctx)return;const o=this.ctx.createOscillator(),g=this.ctx.createGain();o.frequency.value=880;o.connect(g);g.connect(this.ctx.destination);g.gain.setValueAtTime(.0001,this.ctx.currentTime);g.gain.exponentialRampToValueAtTime(.3,this.ctx.currentTime+.02);g.gain.exponentialRampToValueAtTime(.0001,this.ctx.currentTime+.5);o.start();o.stop(this.ctx.currentTime+.55);}catch(e){}if(navigator.vibrate)navigator.vibrate([200,100,200]);}
};

  if(t.dataset.foodExtra){
    const v=t.value.replace(",",".").trim();const f=food(UI.foodDate);
    if(v==="")delete f[t.dataset.foodExtra];else if(!isNaN(+v))f[t.dataset.foodExtra]=+v;
    Store.touchProfile();clearTimeout(window.__fx);window.__fx=setTimeout(()=>{const ae=document.activeElement;const k=ae&&ae.dataset?ae.dataset.foodExtra:null;render();if(k){const el=document.querySelector('[data-food-extra="'+k+'"]');if(el){el.focus();const L=el.value.length;try{el.setSelectionRange(L,L);}catch(_){}}}},700);
    return;
  }
  if(t.dataset.body){
    const v=t.value.replace(",",".").trim();const d=t.dataset.date;
    const b=Store.profile.body[d]||(Store.profile.body[d]={});
    if(v===""){delete b[t.dataset.body];}else if(!isNaN(+v)){b[t.dataset.body]=+v;}
    if(!Object.keys(b).length)delete Store.profile.body[d];
    Store.touchProfile();return;
  }
});
document.addEventListener("change",e=>{
  const t=e.target;
  if(t.id==="importFile"&&t.files&&t.files[0]){
    const fr=new FileReader();
    fr.onload=()=>{try{
      const j=JSON.parse(fr.result);
      if(!j||!j.profile||!j.profile.settings||typeof j.workouts!=="object")throw new Error("formato");
      Store.profile=mergeProfile(j.profile,Store.profile);
      Object.entries(j.workouts).forEach(([id,w])=>{const l=Store.workouts[id];if(!l||(w.updated||0)>=(l.updated||0))Store.workouts[id]=w;});
      Store.touchProfile();closeSheet();render();toast("Respaldo restaurado");
    }catch(err){toast("Ese archivo no es un respaldo válido de Entrenador");}};
    fr.readAsText(t.files[0]);t.value="";return;
  }
  if(t.dataset.action==="ex-sel"){UI.exSel=t.value;render();return;}
});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeSheet();});

/* ============ INICIO ============ */
Store.loadLocal();
render();
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();}catch(e){}
if("serviceWorker" in navigator&&location.protocol==="https:"){window.addEventListener("load",()=>{navigator.serviceWorker.register("sw.js").catch(()=>{});});}
Store.initCloud();
</script>
